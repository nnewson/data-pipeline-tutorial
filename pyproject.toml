[build-system]
requires = ["uv_build>=0.10.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pipeline"

[project]
name = "data-pipeline-tutorial"
version = "0.9"
description = "A step-by-step rebuild of a Kafka, Redis, Cassandra, RabbitMQ, ZooKeeper, Flink and gRPC pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
  "kafka-python",    # Kafka client
  "faker",           # Synthetic event data
  "redis",           # Counters and last-page values
  "cassandra-driver", # Durable, query-shaped event store
  "pika",            # RabbitMQ client
  "kazoo",           # ZooKeeper client
  "fastapi",         # HTTP API over the stores
  "uvicorn",         # ASGI server for the API, run as a single process
  "websockets",      # WebSocket support for uvicorn, and the smoke test's client
]

[project.optional-dependencies]
dev = [
  "pytest", # For testing
  "ruff",   # For formatting and linting
  "honcho", # Runs the Procfile topology
  "httpx2", # FastAPI's test client (Starlette 1.7 deprecates plain httpx)
]

[tool.ruff.lint]
# Selected explicitly rather than inherited from whatever the installed Ruff
# happens to default to. uv.lock pins the version, so a tag cannot spontaneously
# acquire new rules — but refreshing Ruff in a later release would otherwise
# change this project's lint policy silently.
select = [
  "E4", "E7", "E9", # pycodestyle: imports, statements, syntax
  "F",              # pyflakes
  "I",              # import ordering
  "B",              # bugbear
  "BLE",            # no blind except
  "UP",             # modern syntax for the pinned Python
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
create-topics = "pipeline.topics:main"
producer = "pipeline.producer:main"
consumer = "pipeline.kafka_consumer:main"
counters = "pipeline.counters:main"
create-schema = "pipeline.schema:main"
events = "pipeline.events:main"
jobs = "pipeline.jobs:main"
worker = "pipeline.worker:main"
cluster = "pipeline.cluster:main"
coordinator = "pipeline.coordinator:main"
failover-demo = "pipeline.failover_demo:main"
api = "pipeline.api:main"
smoke-test = "pipeline.smoke_test:main"
