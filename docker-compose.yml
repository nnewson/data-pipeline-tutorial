# The system as it stands at 0.2: a Kafka broker, and nothing else. Application
# processes — the producer and consumer — run on the host, against it.
#
# 0.1's throwaway `web` and `shell` services are gone. Kafka's own image carries
# the CLI tools this release needs, which is the pattern from here on.

services:

  kafka:
    # Pinned to a readable version. Kafka 4.x is KRaft-only: ZooKeeper mode was
    # deprecated in 3.5 and removed in 4.0.
    image: apache/kafka:4.3.1
    ports:
      # Only the host listener is published. The internal one does not need to
      # be, because nothing outside the Compose network uses it.
      - "9092:9092"
    environment:
      # KRaft: this one node plays both roles. The controller quorum elects an
      # active controller from among the controller nodes, and brokers register
      # with it — here that quorum is a single voter electing this node, which
      # then registers with itself. Fine for local development, and explicitly
      # not production, where controllers are separate nodes and the quorum has
      # somewhere to fail over to.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Three listeners doing three jobs: one for host processes, one for other
      # containers, one for the controller quorum talking to itself.
      KAFKA_LISTENERS: PLAINTEXT_HOST://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL

      # The addresses the broker hands back to clients on connection. This is
      # 0.1's lesson made load-bearing: a client is told where to go next, so
      # the advertised address has to be correct from that client's position.
      # Get this wrong and the broker is reachable but every produce fails.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092

      # Single node, so nothing can be replicated anywhere.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # Topics are created deliberately by `uv run create-topics`, not invented
      # by whichever client asks for one first. A client that auto-creates a
      # topic picks the partition count by accident.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      # Skip the rebalance delay that would otherwise stall a consumer joining
      # a group for several seconds.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # The image's default log.dirs points at /tmp, and the volume it declares
      # at /var/lib/kafka/data is left empty. Pointing Kafka at that path is
      # what makes the named volume below do anything at all.
      KAFKA_LOG_DIRS: /var/lib/kafka/data

      # KRaft stores cluster metadata in its own log, and that log needs an
      # identity before first start. The image formats storage using this.
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      # Without this the log and its committed offsets live in the container,
      # and `docker compose down` discards both — which would quietly falsify
      # the durability the README demonstrates.
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # Healthy means the broker answers an API request, not merely that the
      # process started.
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 10s

  redis:
    # Pinned to a readable version, as with Kafka.
    image: redis:8.10-alpine
    ports:
      - "6379:6379"
    # Persistence off, deliberately. The image declares no volume, but RDB
    # snapshotting is on by default (save 3600 1 300 100 60 10000), so Redis
    # would otherwise write snapshots into its own filesystem and survive a
    # restart. Counters here are derived state, rebuildable from the Kafka log;
    # 0.5's store is the durable one. Making that true rather than implied.
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  cassandra:
    image: cassandra:5.0
    ports:
      - "9042:9042"
    environment:
      # Single node. The datacenter name has to match the keyspace's
      # NetworkTopologyStrategy, so it is set rather than left to a default.
      CASSANDRA_DC: datacenter1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      # A laptop does not need the default heap.
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    volumes:
      # Cassandra is a durable materialized view: derived from the Kafka log,
      # but expected to outlive its container, unlike Redis.
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "SELECT release_version FROM system.local"]
      interval: 10s
      timeout: 10s
      # Cassandra takes tens of seconds to accept CQL. A long start_period stops
      # those first failures counting against the retry budget.
      retries: 12
      start_period: 90s

volumes:
  kafka-data:
  cassandra-data:
