name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      # Releases are the product of this repository, so the same checks run on
      # a tag push as on a branch push. A workflow cannot prevent a tag from
      # existing; publishing the release after they pass is the actual gate.
      - "*"
  # By hand, to check a release's images still build from nothing — the pinned
  # Flink base image, its apt packages, and the connector's URL and hash.
  workflow_dispatch:

jobs:
  quality:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Unit tests
        run: uv run pytest

      # The live page's tracker and read scheduler are the release's central
      # claims, and they are JavaScript. A separate, explicit step rather than
      # something pytest shells out to: a test that skips when Node is missing
      # is a check that did not run.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # A glob, quoted so Node expands it rather than the shell. Given a bare
      # directory, Node 26 searches it for tests but Node 24 tries to load it
      # as a module and fails with MODULE_NOT_FOUND (measured on both).
      - name: JavaScript tests
        run: node --test "tests/js/*.test.mjs"

      - name: Validate Compose file
        run: docker compose config --quiet

  integration:
    name: Compose smoke test
    runs-on: ubuntu-latest
    # The smoke test bounds its own checks, but image pulls and `compose up
    # --wait` sit outside those. Without this, GitHub's 360-minute default is
    # the real bound.
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Build the Flink image
        # Cache-free on tags and manual runs, so a release proves the pinned base
        # image is still retrievable and the connector's URL and SHA-256 still
        # resolve. A fresh runner has no layer cache either way, so on branches
        # the difference is only --pull: the cache this saves is a laptop's.
        run: |
          if [ "${{ github.ref_type }}" = "tag" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            docker compose build --pull --no-cache
          else
            docker compose build
          fi

      - name: Start the topology
        # --wait blocks until every service with a healthcheck reports healthy,
        # so readiness is asserted rather than slept through. That now includes
        # Flink: the jobmanager is healthy once a taskmanager has registered.
        run: docker compose up -d --wait

      - name: Create topics
        # The defined topic-management path, exercised as a reader would.
        run: uv run create-topics

      - name: Create schema
        # Likewise for Cassandra. `up --wait` already waited for it to be
        # healthy, which on a cold start is 40-90 seconds of the job's budget.
        run: uv run create-schema

      - name: Smoke test
        # Includes starting the real Procfile topology and stopping it again.
        run: uv run smoke-test

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans
