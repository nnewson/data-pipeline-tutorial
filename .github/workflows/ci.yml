name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      # Releases are the product of this repository, so the same checks run on
      # a tag push as on a branch push. A workflow cannot prevent a tag from
      # existing; publishing the release after they pass is the actual gate.
      - "*"

jobs:
  quality:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Unit tests
        run: uv run pytest

      - name: Validate Compose file
        run: docker compose config --quiet

  integration:
    name: Compose smoke test
    runs-on: ubuntu-latest
    # The smoke test bounds its own checks, but image pulls and `compose up
    # --wait` sit outside those. Without this, GitHub's 360-minute default is
    # the real bound.
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Start the topology
        # --wait blocks until every service with a healthcheck reports healthy,
        # so readiness is asserted rather than slept through.
        run: docker compose up -d --wait

      - name: Smoke test
        run: uv run smoke-test

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans
